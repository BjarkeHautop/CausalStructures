# Build tooling only; never compiled into the library. `build.jl` pushes this
# directory onto LOAD_PATH. Instantiate once:
#
#     julia --project=jlbuild/build-env -e "using Pkg; Pkg.instantiate()"

[deps]
JuliaC = "acedd4c2-ced6-4a15-accc-2607eb759ba2"
JuliaLibWrapping = "d61f35a8-f6af-436f-bc10-cee6b101f7bd"

[sources]
JuliaLibWrapping = {path = "../../../JuliaLibWrapping.jl/JuliaLibWrapping"}

[compat]
JuliaC = "0.3.10"
JuliaLibWrapping = "0.2"
julia = "1.13"
