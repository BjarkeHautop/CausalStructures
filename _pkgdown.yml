url: https://bjarkehautop.github.io/testpkg/
template:
  bootstrap: 5

reference:
  - title: "Construction"
    desc: "Build graphs from edge expressions or at random."
    contents:
      - cgraph
      - edge-operators
      - generate_graph

  - title: "Graph queries"
    desc: "Whole-graph queries: nodes, edges, and adjacency."
    contents:
      - graph-queries
      - has_edge
      - edges

  - title: "Node-set queries"
    desc: "Relatives of a single node."
    contents:
      - node-queries
      - neighbors
      - possible-queries

  - title: "Graph class predicates"
    desc: "Test structural properties of a graph."
    contents:
      - predicates

  - title: "Transformations"
    desc: "Derive a new graph from an existing one."
    contents:
      - transforms
      - subgraph
      - latent_project
      - exogenize
      - normalize_latent_structure
      - condition_marginalize

  - title: "Mutation and reclassification"
    desc: "Add or remove edges/nodes, or change a graph's tagged class."
    contents:
      - edge-mutation
      - node-mutation
      - reclass

  - title: "Separation and identification"
    desc: "d-/m-separation and adjustment/frontdoor/IV identification."
    contents:
      - d_separated
      - m_separated
      - minimal_separator
      - adjustment_set
      - frontdoor_set
      - is_valid_backdoor
      - all_backdoor_sets
      - all_frontdoor_sets
      - is_valid_adjustment
      - all_adjustment_sets
      - is_valid_frontdoor
      - is_valid_iv
      - all_iv_sets

  - title: "Equivalence classes"
    desc: "Count and enumerate Markov equivalent graphs."
    contents:
      - equivalence
      - markov_equivalent
      - enumerate_mags

  - title: "Data generation"
    contents:
      - simulate_data

  - title: "Plotting"
    contents:
      - plot.cgraph
      - layout

  - title: "Managing Julia"
    contents:
      - julia_available
      - setup
