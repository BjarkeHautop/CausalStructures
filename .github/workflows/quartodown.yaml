# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: quartodown.yaml

permissions: read-all

jobs:
  quartodown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: quartodown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"

      - uses: julia-actions/cache@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: website

      # The library that install_backend() would build, built by jlbind from the
      # sources and handed to the package through JLBIND_LIBRARY.
      - name: Build the CausalStructures.jl library
        run: |
          Rscript -e 'jlbind::build_library(".", file.path(Sys.getenv("RUNNER_TEMP"), "jlbind"))'
          echo "JLBIND_LIBRARY=$RUNNER_TEMP/jlbind/jlbind.so" >> "$GITHUB_ENV"
        shell: bash

      - name: Build site
        run: quartodown::build_site()
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
