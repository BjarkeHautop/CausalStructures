# Builds the library with the newest dependency versions inst/julia/Project.toml
# allows, ignoring the shipped Manifest.toml (what
# `jlbind::install_library(versions = "compat")` does), and runs the tests against it. This catches a release of
# CausalStructures.jl or another dependency (or a newer Julia) that breaks the
# `--trim=safe` build before users of `versions = "compat"` hit it, and tells when
# the manifest can be updated.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: julia-update.yaml

permissions: read-all

jobs:
  julia-update:
    runs-on: ubuntu-latest

    name: Julia ${{ matrix.julia }} (newest dependencies)

    strategy:
      fail-fast: false
      matrix:
        # The Julia version the package requires, and the newest release.
        julia: ["1.13", "1"]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}

      - uses: julia-actions/cache@v3

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check

      # The library that jlbind::install_library(versions = "compat") would
      # build, built from the sources and handed to the package through
      # JLBIND_LIBRARY.
      - name: Build the CausalStructures.jl library
        run: |
          Rscript -e 'jlbind::build_library(".", file.path(Sys.getenv("RUNNER_TEMP"), "jlbind"), versions = "compat")'
          echo "JLBIND_LIBRARY=$RUNNER_TEMP/jlbind/jlbind.so" >> "$GITHUB_ENV"
        shell: bash

      - name: Run tests
        run: |
          pkgload::load_all(".")
          stopifnot(julia_ready())
          testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
