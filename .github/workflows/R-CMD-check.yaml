# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.library == '' && ' without Julia' || '' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release', library: 'csjl.so'}
          - {os: windows-latest,  r: 'release', library: 'csjl.dll'}
          # What CRAN sees: no compiled library, so every example and test
          # needing it must skip.
          - {os: ubuntu-latest,   r: 'release', library: ''}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        if: matrix.config.library != ''
        with:
          version: "1.13"

      - uses: julia-actions/cache@v3
        if: matrix.config.library != ''

      # The library that install_backend() would build, built from the sources
      # and handed to the package through CAUSALSTRUCTURES_LIBRARY.
      - name: Build the CausalStructures.jl library
        if: matrix.config.library != ''
        run: |
          julia --startup-file=no inst/julia/build.jl "$RUNNER_TEMP/csjl"
          echo "CAUSALSTRUCTURES_LIBRARY=$RUNNER_TEMP/csjl/${{ matrix.config.library }}" >> "$GITHUB_ENV"
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
