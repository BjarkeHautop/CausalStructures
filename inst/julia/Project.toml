name = "csjl"
uuid = "5b7847be-0a43-48f2-a83d-4b9045fd9db0"
version = "0.1.0"

# The binding package of the R package, which jlbind::install_library() compiles
# into one library with those of the other installed packages using jlbind.
# Only runtime dependencies belong here. The shipped Manifest.toml pins their
# exact versions.

[deps]
CausalStructures = "b41ab49a-79bc-5eac-acbb-517b17bd5c16"
JLBind = "afbbfe3b-b84d-4508-8d61-b26819a6ee14"
NetworkLayout = "46757867-2c16-5918-afeb-47bfcb05e46a"
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"
Sugiyama = "a85cd6b6-3810-52a0-aaf7-38a6bd88fd85"

[compat]
CausalStructures = "1.2.0"
NetworkLayout = "0.4.11"
StableRNGs = "1"
Sugiyama = "1.0.1"
julia = "1.13"

# JLBind's source only lets Pkg resolve this environment; builds use jlbind's
# installed copy of JLBind instead. NetworkLayout.jl compiles under --trim only
# on this branch, not yet released.
[sources]
JLBind = {url = "https://github.com/BjarkeHautop/jlbind", subdir = "inst/julia/JLBind", rev = "main"}
NetworkLayout = {url = "https://github.com/BjarkeHautop/NetworkLayout.jl", rev = "trim-compat"}
