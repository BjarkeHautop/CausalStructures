# Configuration for quartodown::build_site(). See ?quartodown::build_site for
# all fields, including `navbar:` (article order) and `quarto:` (extra
# Quarto settings).

navbar:
  left:
    - intro
    - reference
    - text: Articles
      menu:
        - articles/equivalence-classes
        - articles/causal-identification
        - articles/pag-causal-effects
        - articles/plot
        - articles/benchmarks
    - news

# Groups the function reference index, in the same shape as pkgdown's
# `reference:` field.
reference:
  - title: "Construction"
    desc: "Build causal graphs."
    contents:
      - cgraph
      - edge-operators
      - cgraph-equality

  - title: "Graph queries"
    desc: "Whole-graph queries: nodes, edges, and adjacency."
    contents:
      - graph-queries
      - has_edge
      - edges

  - title: "Node-set queries"
    desc: "Relatives of a single node."
    contents:
      - node-queries
      - markov_blanket
      - neighbors
      - possible-queries
      - anteriors
      - possible_d_sep
      - districts

  - title: "Graph class predicates"
    desc: "Test structural properties of a graph."
    contents:
      - predicates

  - title: "Transformations"
    desc: "Derive a new graph from an existing one."
    contents:
      - skeleton
      - moralize
      - dag_to_cpdag
      - dag_from_pdag
      - meek_closure
      - apply_background_knowledge
      - dag_to_mpdag
      - ag_to_mag
      - mag_to_pag
      - mag_from_pag
      - subgraph
      - latent_project
      - exogenize
      - normalize_latent_structure
      - condition_marginalize

  - title: "Mutation and reclassification"
    desc: "Add or remove edges/nodes, or change a graph's tagged class."
    contents:
      - edge-mutation
      - node-mutation
      - reclass

  - title: "Separation and identification"
    desc: "d-/m-separation and adjustment/frontdoor/IV identification."
    contents:
      - d_separated
      - m_separated
      - minimal_separator
      - adjustment_set
      - frontdoor_set
      - is_valid_backdoor
      - all_backdoor_sets
      - all_frontdoor_sets
      - is_valid_adjustment
      - all_adjustment_sets
      - is_valid_frontdoor
      - is_valid_iv
      - all_iv_sets
      - iv_set
      - backdoor_set
      - id
      - idp

  - title: "Local IDA"
    desc: "Local structure-learning identification (IDA and its variants)."
    contents:
      - possible_parent_sets
      - possible_joint_parent_sets
      - possible_optimal_adjustment_sets
      - possible_local_structures
      - maximal_local_mag
      - pagcauses

  - title: "Equivalence classes"
    desc: "Count and enumerate Markov equivalent graphs."
    contents:
      - equivalence
      - markov_equivalent
      - enumerate_mags

  - title: "Metrics"
    desc: "Compare two graphs, e.g. a learned graph with the true one."
    contents:
      - hamming
      - aid
      - separation_distance
      - sc-metrics

  - title: "Generation and simulation"
    contents:
      - simulate_data
      - generate_graph
      - uniform_dag

  - title: "Plotting"
    contents:
      - plot.cgraph
      - cgraph_layout
      - plot_options
      - plot_default_options

  - title: "Setup"
    desc: "Build the compiled CausalStructures.jl library the package calls."
    contents:
      - install_backend
      - julia_ready
      - CausalStructures_options
